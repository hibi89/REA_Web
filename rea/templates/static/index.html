<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>REA | 내 데이터 웹앱</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header class="top"><span class="mark">REA</span><span>Customer Data App <small>· Local MVP</small></span></header>
  <main class="layout">
    <section class="intro"><p class="eyebrow">REA WEB · CSV → APP</p><h1>내 데이터로 만든 웹앱</h1><p>검색하고, 필터링하고, 상세 정보를 확인하세요.</p></section>
    <div class="shell">
      <section class="panel">
        <div class="panel-title"><h2>데이터 목록</h2><span id="count">불러오는 중…</span></div>
        <div class="controls">
          <label><span>검색</span><input id="search" type="search" placeholder="상품명 또는 ID" autocomplete="off"></label>
          <label><span>카테고리</span><select id="category"><option value="">전체 카테고리</option></select></label>
        </div>
        <p id="error" role="alert" hidden></p>
        <div id="results" class="result-list" aria-live="polite"></div>
      </section>
      <aside class="panel detail">
        <div class="panel-title"><h2>상세 정보</h2><span class="hint">항목 선택</span></div>
        <div id="detail"><p class="empty">왼쪽에서 항목을 선택하세요.</p></div>
      </aside>
    </div>
    <footer>고객 제공 데이터로 생성된 독립 로컬 앱 · 읽기 전용</footer>
  </main>
</body>
</html>
