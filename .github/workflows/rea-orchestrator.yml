name: REA D2 combined CSV + optional Fable
on:
  push:
    branches: [feature/orchestrator]
  pull_request:
    branches: [integration/develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned Astra contracts (read only, no vendor merge)
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: f044b66e799289a5a353fdb9cbfdb324e683ffa3
          path: .vendor/astra
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1" "pytest>=8,<10" "pydantic>=2.6,<3" "playwright>=1.50,<2"
      - name: CSV baseline + adapter + D2 orchestration regression
        env:
          PYTHONPATH: ".vendor/astra/engines/astra_p4:."
        run: python -m pytest -q tests/test_mvp.py tests/test_adapter.py tests/test_orchestrator.py
      - name: Fable optional and CSV-only generate
        env:
          PYTHONPATH: ".vendor/astra/engines/astra_p4:."
        run: |
          python -m rea.orchestrator --csv samples/products.csv --out /tmp/rea-d2-csv-only
          python -m rea.orchestrator --csv samples/products.csv --out /tmp/rea-d2-with-review --fable-result samples/fable_record_redacted.json
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('/tmp/rea-d2-csv-only/manifest.json').read_text())
          b = json.loads(Path('/tmp/rea-d2-with-review/manifest.json').read_text())
          f = json.loads(Path('/tmp/rea-d2-with-review/review/fable_review.json').read_text())
          assert a['rows'] == b['rows'] == 5
          assert a['fable_review']['status'] == 'NOT_REQUESTED'
          assert b['fable_review']['status'] == f['status'] == 'REVIEW_REQUIRED'
          assert not b['fable_review']['used_for_generation']
          assert not f['generation_allowed'] and not f['implementation_ready']
          assert f['astra_contract_validation'] == 'VALIDATED'
          print('PASS: CSV-only and optional Fable review; no automatic mapping')
          PY
      - run: python -m compileall -q rea /tmp/rea-d2-csv-only /tmp/rea-d2-with-review
      - run: python -m playwright install --with-deps chromium
      - name: Actual Chromium orchestrated app smoke
        env:
          PYTHONPATH: ".vendor/astra/engines/astra_p4:."
        run: python scripts/orchestrator_browser_smoke.py
