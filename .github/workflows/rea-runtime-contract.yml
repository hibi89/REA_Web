name: REA backend ZIP static-runtime OpenAPI reconciliation
on:
  push:
    branches: [feature/rea-backend-zip-contract-20261101]
    paths:
      - 'rea/adapter/runtime_contract.py'
      - 'tests/test_runtime_contract.py'
      - '.github/workflows/rea-runtime-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-declarations:
    name: OpenAPI reconciliation / ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic test dependencies
        run: python -m pip install 'pytest>=8,<10' 'fastapi>=0.110,<1' 'httpx>=0.27,<1'
      - name: Compile isolated code
        run: python -m compileall -q rea/adapter/runtime_contract.py tests/test_runtime_contract.py
      - name: Trusted synthetic OpenAPI and ZIP static regressions
        run: python -m pytest -q tests/test_runtime_contract.py tests/test_backend_schema.py tests/test_backend_zip.py
