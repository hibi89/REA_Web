name: REA trusted synthetic combined project ZIP and browser QA
on:
  push:
    branches: [feature/rea-backend-zip-contract-20261101]
    paths:
      - 'rea/adapter/project_bundle.py'
      - 'rea/adapter/frontend_bridge.py'
      - 'rea/adapter/visual_reference.py'
      - 'rea/adapter/behavior_probe.py'
      - 'rea/adapter/runtime_supervisor.py'
      - 'rea/adapter/docker_sandbox.py'
      - 'tests/test_project_bundle.py'
      - 'tests/test_behavior_probe.py'
      - 'tests/test_runtime_supervisor.py'
      - 'tests/test_docker_sandbox.py'
      - 'tests/test_project_bundle_browser.py'
      - 'tests/test_project_bundle_http.py'
      - 'tests/test_project_bundle_runtime_inventory.py'
      - 'tests/test_project_bundle_frontend_pin.py'
      - 'tests/test_styled_bundle_offline_browser.py'
      - '.github/workflows/rea-project-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-bundle:
    name: Clean ZIP unpack and REAL Chromium / ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trusted synthetic test dependencies
        run: python -m pip install 'pytest>=8,<10' 'fastapi>=0.110,<1' 'uvicorn>=0.27,<1' 'httpx>=0.27,<1' 'playwright>=1.50,<2'
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Compile new source and tests
        run: python -m compileall -q rea/adapter/project_bundle.py rea/adapter/behavior_probe.py rea/adapter/runtime_supervisor.py rea/adapter/docker_sandbox.py tests/test_docker_sandbox.py tests/test_project_bundle.py tests/test_behavior_probe.py tests/test_runtime_supervisor.py tests/test_docker_sandbox.py tests/test_project_bundle_browser.py tests/test_project_bundle_http.py tests/test_project_bundle_runtime_inventory.py tests/test_project_bundle_frontend_pin.py tests/test_styled_bundle_offline_browser.py
      - name: Test synthetic project packaging and actual extracted runtime browser E2E
        run: python -m pytest -q tests/test_project_bundle.py tests/test_behavior_probe.py tests/test_runtime_supervisor.py tests/test_docker_sandbox.py tests/test_project_bundle_browser.py tests/test_project_bundle_http.py tests/test_project_bundle_runtime_inventory.py tests/test_project_bundle_frontend_pin.py tests/test_styled_bundle_offline_browser.py
