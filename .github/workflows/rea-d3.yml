name: REA D3 three-domain delivery acceptance
on:
  push:
    branches: [qa/cross-platform]
  pull_request:
    branches: [integration/develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-browser-3-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only pinned Astra P4 checkout
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: f044b66e799289a5a353fdb9cbfdb324e683ffa3
          path: .vendor/astra
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1" "pytest>=8,<10" "pydantic>=2.6,<3" "playwright>=1.50,<2"
      - name: D1 to D3 Python regression and delivery
        env:
          PYTHONPATH: ".vendor/astra/engines/astra_p4:."
        run: python -m pytest -q tests/test_mvp.py tests/test_adapter.py tests/test_orchestrator.py tests/test_d3.py
      - run: python -m compileall -q rea scripts
      - run: python -m playwright install --with-deps chromium
      - name: Three generated apps actual Chromium E2E
        env:
          PYTHONPATH: ".vendor/astra/engines/astra_p4:."
        run: python scripts/d3_browser_acceptance.py --report-dir /tmp/rea-d3-evidence
      - name: Create and verify example ZIP
        run: |
          python -m rea.delivery pack --csv samples/qa_cafe.csv --out /tmp/rea-d3-evidence/REA_Web_Cafe_v0.9.zip
          python -m rea.delivery verify --zip /tmp/rea-d3-evidence/REA_Web_Cafe_v0.9.zip
      - name: Publish only synthetic acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d3-synthetic-linux-qa
          path: /tmp/rea-d3-evidence/
          if-no-files-found: warn
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned Astra contracts for Windows
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: f044b66e799289a5a353fdb9cbfdb324e683ffa3
          path: .vendor/astra
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1" "pytest>=8,<10" "pydantic>=2.6,<3"
      - name: Windows Python ZIP and integration regression
        shell: pwsh
        run: |
          $env:PYTHONPATH = ".vendor/astra/engines/astra_p4;."
          python -m pytest -q tests/test_mvp.py tests/test_adapter.py tests/test_orchestrator.py tests/test_d3.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Windows CMD launcher and loopback API
        shell: pwsh
        run: |
          python scripts/windows_native_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
