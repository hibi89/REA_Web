name: REA reviewed frontend generation and real backend browser check
on:
  push:
    branches: [feature/rea-backend-zip-contract-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-frontend-integration:
    name: Reviewed frontend and fixture HTTP / ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic integration test dependencies
        run: python -m pip install 'pytest>=8,<10' 'fastapi>=0.110,<1' 'uvicorn>=0.27,<1' 'playwright>=1.50,<2' 'httpx>=0.27,<1'
      - name: Install Chromium Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Compile
        run: python -m compileall -q rea/adapter/backend_zip.py rea/adapter/backend_schema.py rea/adapter/frontend_bridge.py rea/adapter/visual_reference.py tests/test_frontend_bridge.py tests/test_frontend_bridge_browser.py tests/test_visual_reference.py tests/test_backend_schema.py tests/test_generic_presentation.py tests/test_generic_presentation_browser.py tests_static_fixture.py tests/test_frontend_bridge_offline_browser.py tests/test_frontend_bridge_asgi_browser.py tests/test_frontend_race_browser.py tests/test_frontend_detail_race_browser.py tests/test_search_refresh_browser.py tests/test_detail_local_error_browser.py rea/adapter/docker_image_evidence.py tests/test_docker_image_evidence.py
      - name: Reviewed Fable/backend plus HTTP, Chromium DOM, ASGI fixture and evidence parser regressions
        run: python -m pytest -q tests/test_backend_zip.py tests/test_backend_schema.py tests/test_adapter.py tests/test_frontend_bridge.py tests/test_generic_presentation.py tests/test_frontend_bridge_browser.py tests/test_generic_presentation_browser.py tests/test_visual_reference.py tests/test_frontend_bridge_offline_browser.py tests/test_frontend_bridge_asgi_browser.py tests/test_frontend_race_browser.py tests/test_frontend_detail_race_browser.py tests/test_search_refresh_browser.py tests/test_detail_local_error_browser.py tests/test_docker_image_evidence.py
