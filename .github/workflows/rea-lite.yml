name: REA Lite isolated Pro integration and file URL E2E
on:
  push:
    branches: [feature/rea-lite-integrated-20261101]
  pull_request:
    branches: [integration/develop]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  real-parser-and-file-browser:
    name: Lite ${{ matrix.os }} Python 3.11 / Chromium
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test-only dependencies
        run: python -m pip install "pytest>=8,<10" "playwright>=1.50,<2"
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Syntax compile
        run: python -m compileall -q rea/lite_builder.py tests/test_rea_lite_integration.py tests/test_rea_lite_browser.py
      - name: Actual Pro parser and safe publish integration
        run: python -m pytest -q tests/test_rea_lite_integration.py
      - name: Node CSV and security boundary
        run: node tests/test_rea_lite_csv.cjs
      - name: Real Chromium file navigation and export/reopen
        run: python -m pytest -q tests/test_rea_lite_browser.py
      - name: Verify deterministic three-theme owner pilot package
        run: python -m pytest -q tests/test_rea_lite_owner_pilot.py
      - name: Build three-theme synthetic pilot (Linux only)
        if: runner.os == 'Linux'
        run: python -m scripts.rea_lite_owner_pilot --out REA_Lite_3Theme_OWNER_SYNTHETIC_NOT_FOR_SALE.zip
      - name: Upload synthetic owner pilot (not public commercial release)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rea-lite-owner-synthetic-pilot
          path: REA_Lite_3Theme_OWNER_SYNTHETIC_NOT_FOR_SALE.zip
          if-no-files-found: error
          retention-days: 7
