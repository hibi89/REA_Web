name: REA Lite offline owner HTML builder regression
on:
  push:
    branches: [feature/lite-offline-html-20261112]
  pull_request:
    paths:
      - 'rea/lite_builder.py'
      - 'rea/lite_assets/**'
      - 'tests/test_lite_builder.py'
      - '.github/workflows/rea-lite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lite-scoped-and-pro-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Scoped offline builder and local byte integrity
        run: python -m unittest discover -s tests -p test_lite_builder.py -v
      - name: Compile builder and original Pro parser
        run: python -m py_compile rea/lite_builder.py rea/mvp.py
      - name: Install test-only Pro dependencies
        run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1" "pytest>=8,<10" "pydantic>=2.6,<3"
      - name: Real original Pro parsing and customer browser generation regression
        run: python -m pytest -q tests/test_lite_builder.py tests/test_mvp.py
