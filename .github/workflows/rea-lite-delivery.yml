name: REA Lite owner delivery ZIP validation
on:
  push:
    branches:
      - feature/lite-owner-delivery-p95-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-delivery-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile source without network
        run: python -m py_compile rea/lite_builder.py rea/lite_delivery.py rea/mvp.py
      - name: Full Lite builder and delivery standard-library tests
        run: |
          python -m unittest discover -s tests -p test_lite_builder.py -v
          python -m unittest discover -s tests -p test_lite_delivery.py -v
      - name: Install original Pro test-only dependencies
        run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1" "pytest>=8,<10" "pydantic>=2.6,<3"
      - name: Original parser and Lite delivery cross integration
        run: python -m pytest -q tests/test_lite_builder.py tests/test_lite_delivery.py tests/test_mvp.py
