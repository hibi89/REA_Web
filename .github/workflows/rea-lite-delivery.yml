name: REA Lite owner delivery ZIP validation
on:
  push:
    branches:
      - feature/lite-owner-delivery-p95-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-delivery-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile source without network
        run: python -m py_compile rea/lite_builder.py rea/lite_delivery.py rea/lite_owner_kit.py rea/mvp.py
      - name: Full Lite builder and delivery standard-library tests
        run: |
          python -m unittest discover -s tests -p test_lite_builder.py -v
          python -m unittest discover -s tests -p test_lite_delivery.py -v
          python -m unittest discover -s tests -p test_lite_owner_kit.py -v
      - name: Native packaged file URL browser check
        run: python tests/lite_file_browser_gate.py
        env:
          PYTHONPATH: .
      - name: Real file URL CSV import, HTML export and ZIP re-verification
        run: python tests/lite_file_customer_flow.py
        env:
          PYTHONPATH: .
      - name: Install original Pro test-only dependencies
        run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1" "pytest>=8,<10" "pydantic>=2.6,<3"
      - name: Original parser and Lite delivery cross integration
        run: python -m pytest -q tests/test_lite_builder.py tests/test_lite_delivery.py tests/test_lite_owner_kit.py tests/test_mvp.py
      - name: Install original Pro full-suite test extras
        run: python -m pip install "playwright>=1.50,<2" "packaging>=23,<27"
      - name: Real customer file download and reopen across three industries
        run: python tests/lite_playwright_delivery.py
        env:
          PYTHONPATH: .
      - name: Full original Pro and new Lite regression suite
        run: python -m pytest -q tests
