name: REA bootstrap and vendor integrity
on:
  push:
    branches: [main, integration/develop, "import/**", "qa/**"]
  pull_request:
    branches: [main, integration/develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pinned vendor Git blob manifests (when present)
        run: python tools/verify_vendor_manifests.py --allow-absent
      - name: Verify master documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          req = [
              "README.md", "AGENTS.md", "STATUS.md", "HANDOFF.md",
              "docs/01_PRODUCT_SCOPE.md", "docs/02_ARCHITECTURE.md",
              "docs/04_ROADMAP.md", "docs/05_ACCEPTANCE.md",
              "docs/07_KMONG_OFFER.md", "docs/08_BRANCH_POLICY.md",
              "docs/13_WORK_BREAKDOWN.md", "docs/17_NEXT_TASK.md",
          ]
          missing = [p for p in req if not Path(p).is_file()]
          assert not missing, "Missing docs: " + str(missing)
          print("PASS REA_BOOTSTRAP_DOCS:", len(req))
          PY
