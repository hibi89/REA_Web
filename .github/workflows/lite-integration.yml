name: REA Lite actual parser and file-browser acceptance

on:
  pull_request:
    branches: [feature/d27-windows-python-discovery]
    paths:
      - "rea/lite_builder.py"
      - "rea/lite_assets/**"
      - "tests/test_rea_lite_builder.py"
      - "tests/test_lite_file_browser.py"
      - "tests/test_lite_packaged_pilot.py"
      - "tests/test_lite_keyboard_file_picker.py"
      - "tests/test_csv_contract.cjs"
      - "tests/test_vm_interactions.cjs"
      - "scripts/lite_delivery_rehearsal.py"
      - ".github/workflows/lite-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lite:
    name: "Lite Python/Chromium (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only requirements
        run: |
          python -m pip install "pytest>=8,<10" "playwright>=1.45,<2"
          python -m playwright install chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline CSV and JS DOM contracts
        run: |
          node tests/test_csv_contract.cjs
          node tests/test_vm_interactions.cjs
      - name: Reproduce three synthetic seller deliveries (CLI and no-overwrite)
        run: python scripts/lite_delivery_rehearsal.py --out-dir lite_delivery_output
      - name: Preserve synthetic-only pilot artifacts and timing report
        uses: actions/upload-artifact@v4
        with:
          name: "rea-lite-synthetic-${{ matrix.os }}"
          path: |
            lite_delivery_output/REA_WEB_Lite_Synthetic_Pilot.zip
            lite_delivery_output/rehearsal_report.json
          if-no-files-found: error
      - name: Actual Pro parser integrated unit checks
        run: python -m pytest -q tests/test_rea_lite_builder.py
      - name: On-disk file URL HTML, CSV and download/reopen in Chromium
        run: python -m pytest -q tests/test_lite_file_browser.py
      - name: Actual packaged ZIP HTML opened via Chromium file URL
        run: python -m pytest -q tests/test_lite_packaged_pilot.py
      - name: On-disk file URL HTML, CSV and download/reopen in Microsoft Edge (Windows)
        if: matrix.os == 'windows-latest'
        env:
          REA_BROWSER_CHANNEL: msedge
        run: python -m pytest -q tests/test_lite_file_browser.py
      - name: Keyboard-only CSV picker Enter/Space Chromium
        run: python -m pytest -q tests/test_lite_keyboard_file_picker.py
      - name: Actual packaged ZIP HTML opened via Microsoft Edge file URL (Windows)
        if: matrix.os == 'windows-latest'
        env:
          REA_BROWSER_CHANNEL: msedge
        run: python -m pytest -q tests/test_lite_packaged_pilot.py
      - name: Keyboard-only CSV picker Enter/Space Microsoft Edge (Windows)
        if: matrix.os == 'windows-latest'
        env:
          REA_BROWSER_CHANNEL: msedge
        run: python -m pytest -q tests/test_lite_keyboard_file_picker.py
