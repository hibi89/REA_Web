name: REA website P50 synthetic Fable-Astra-Pro acceptance
on:
  push:
    branches: [feature/website-analysis-rebuild]
    paths:
      - "rea/website_rebuild.py"
      - "tests/test_website_rebuild_p50.py"
      - ".github/workflows/rea-website-p50.yml"
      - "rea/orchestrator.py"
      - "rea/adapter/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-fable-astra-pro-vertical:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Frozen Fable 5.1 source
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: 7e6f273b359b207fad8f92016226e3058cbcb839
          path: .vendor/fable
          persist-credentials: false
      - name: Frozen Astra P4 source
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: f044b66e799289a5a353fdb9cbfdb324e683ffa3
          path: .vendor/astra
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install synthetic test runtime only, no OpenAI API
        run: python -m pip install "fastapi>=0.110,<1" "httpx>=0.27,<1" "uvicorn>=0.27,<1" "pydantic>=2.6,<3" "pytest>=8,<10" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Compile original Pro and website integration
        run: python -m compileall -q rea/website_rebuild.py rea/orchestrator.py rea/adapter
      - name: Real loopback Fable scan, Astra models, generated Pro app E2E
        env:
          PYTHONPATH: ".vendor/astra/engines/astra_p4:."
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q tests/test_website_rebuild_p50.py tests/test_orchestrator.py
