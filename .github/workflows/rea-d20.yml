name: REA D20 offline pilot selfcheck and full regression
on:
  push:
    branches: [feature/offline-pilot-selfcheck]
  pull_request:
    branches: [integration/develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-d1-d20-and-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned Fable 88 source files
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: 7e6f273b359b207fad8f92016226e3058cbcb839
          path: .vendor/fable
          persist-credentials: false
      - name: Pinned Astra 103 PARTIAL source files
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: f044b66e799289a5a353fdb9cbfdb324e683ffa3
          path: .vendor/astra
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install developer tests only
        run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1" "pytest>=8,<10" "pydantic>=2.6,<3" "playwright>=1.50,<2" "packaging>=23,<27"
      - name: Full D1-D20 pytest regression
        env:
          PYTHONPATH: ".vendor/astra/engines/astra_p4:."
        run: python -m pytest -q tests
      - name: GUI module import without DISPLAY and stdlib Tk availability check
        run: python -c "import rea.creator_gui; print('D14 GUI import PASS; no display opened')"
      - name: Provenance pinned blobs, not rights
        run: |
          python -m rea.provenance verify-vendor --vendor fable51 --root .vendor/fable
          python -m rea.provenance verify-vendor --vendor astra_p4 --root .vendor/astra
      - run: python -m compileall -q rea scripts
      - name: Actual Tk GUI widget exercise under virtual DISPLAY (synthetic fixture only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth
          python -m pip install "pillow>=10,<13"
          xvfb-run -a -s "-screen 0 1280x900x24" python -m scripts.d14_tk_visual_smoke --out /tmp/rea-d18-visual
      - name: Upload real synthetic Tk widget screenshot and no-PII receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d18-linux-real-tk-visual-evidence
          path: /tmp/rea-d18-visual/
          if-no-files-found: warn
      - name: Real second-window two-file APPEND Tk E2E on Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1280x950x24" python -m scripts.d15_pair_tk_smoke --out /tmp/rea-d18-pair-ui
      - name: Upload synthetic real-Tk two-file APPEND evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d18-linux-pair-tk-evidence
          path: /tmp/rea-d18-pair-ui/
          if-no-files-found: warn
      - name: 8 Chromium synthetic webapps
        env:
          PYTHONPATH: ".vendor/astra/engines/astra_p4:."
        run: |
          python -m playwright install --with-deps chromium
          python scripts/d3_browser_acceptance.py --report-dir /tmp/rea-d18-browser
      - name: 3 EXTRACTED customer-like ZIPs in Chromium
        run: |
          python -m scripts.d11_rehearsal --out /tmp/rea-d18-quotes
          python scripts/d11_browser_rehearsal.py --rehearsal /tmp/rea-d18-quotes --report-dir /tmp/rea-d18-zip-browser
      - name: Windows generated D19 synthetic kit and strict verify, no human claims
        shell: pwsh
        run: |
          python -m scripts.d19_owner_pilot build --out "$env:RUNNER_TEMP/rea-d19-owner-pilot-win.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.d19_owner_pilot verify --zip "$env:RUNNER_TEMP/rea-d19-owner-pilot-win.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows D20 shipped offline checker on extracted kit (no runtime pip or network)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP/rea-d20-extracted-kit"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          python -c "import zipfile,sys;zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$env:RUNNER_TEMP/rea-d19-owner-pilot-win.zip" $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$out/CHECK_PILOT_OFFLINE.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline dependency NOTICE metadata audit OUTSIDE ZIP
        run: python -m rea.dependency_evidence --out ./d18-linux-evidence.json
      - name: Build and VERIFY deterministic synthetic-only D19 owner pilot ZIP
        run: |
          python -m scripts.d19_owner_pilot build --out /tmp/rea-d19-owner-pilot.zip
          python -m scripts.d19_owner_pilot verify --zip /tmp/rea-d19-owner-pilot.zip
      - name: D20 run shipped stdlib offline checker against EXTRACTED pilot kit
        run: |
          mkdir -p /tmp/rea-d20-extracted-kit
          python -c "import zipfile; zipfile.ZipFile('/tmp/rea-d19-owner-pilot.zip').extractall('/tmp/rea-d20-extracted-kit')"
          python /tmp/rea-d20-extracted-kit/CHECK_PILOT_OFFLINE.py
      - name: Upload synthetic-only D19 owner pilot artifact, NOT a commercial release
        uses: actions/upload-artifact@v4
        with:
          name: rea-d20-synthetic-windows-owner-pilot
          path: /tmp/rea-d19-owner-pilot.zip
          if-no-files-found: error
      - name: Upload developer-only audit (NOT license grant)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d18-linux-dependency-evidence
          path: d18-linux-evidence.json
          if-no-files-found: warn

  windows-d1-d20-and-native-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Disable CRLF conversion for exact vendor Git blobs
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.safecrlf false
      - name: Pinned Fable 88 source files
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: 7e6f273b359b207fad8f92016226e3058cbcb839
          path: .vendor/fable
          persist-credentials: false
      - name: Pinned Astra 103 PARTIAL source files
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: f044b66e799289a5a353fdb9cbfdb324e683ffa3
          path: .vendor/astra
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install developer tests only
        run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1" "pytest>=8,<10" "pydantic>=2.6,<3" "packaging>=23,<27"
      - name: Full D1-D20 Windows pytest regression
        shell: pwsh
        run: |
          $env:PYTHONPATH = ".vendor/astra/engines/astra_p4;."
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows Tkinter import availability without opening a GUI
        shell: pwsh
        run: |
          python -c "import tkinter; import rea.creator_gui; print('GUI import PASS; human GUI acceptance NOT RUN')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows actual Tk desktop probe, honest NOT_RUN when no GUI session
        shell: pwsh
        run: |
          python -m scripts.d14_windows_gui_probe --out $env:RUNNER_TEMP/rea-d18-win-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows actual Tk/NOT_RUN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d18-windows-gui-evidence
          path: ${{ runner.temp }}/rea-d18-win-ui/
          if-no-files-found: warn
      - name: Real Windows two-file Tk APPEND synthetic desktop probe
        shell: pwsh
        run: |
          python -m scripts.d15_windows_pair_probe --out $env:RUNNER_TEMP/rea-d18-win-pair
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows two-file Tk PASS or NOT_RUN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d18-windows-pair-tk-evidence
          path: ${{ runner.temp }}/rea-d18-win-pair/
          if-no-files-found: warn
      - name: Native Windows creator CMD actual READY, invalid arg, missing Python checks
        shell: pwsh
        run: |
          python scripts/d16_windows_creator_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh isolated Windows venv, missing-modules refuse then CI-only dependency install, real Tk pair ZIP
        shell: pwsh
        run: |
          python -m scripts.d17_windows_fresh_venv --out "$env:RUNNER_TEMP/rea-d18-fresh-venv-evidence.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: D18 native fresh isolated Windows venv actual Tk ZIP same-venv localhost HTTP
        shell: pwsh
        run: |
          python -m scripts.d18_windows_fresh_http --out "$env:RUNNER_TEMP/rea-d18-fresh-http-evidence.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload D18 path-free fresh-venv HTTP evidence (no ZIP, customer data or screenshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d18-windows-virgin-venv-http
          path: ${{ runner.temp }}/rea-d18-fresh-http-evidence.json
          if-no-files-found: warn
      - name: Upload developer-only fresh Windows venv result, no client data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d18-windows-fresh-venv-onboarding
          path: ${{ runner.temp }}/rea-d18-fresh-venv-evidence.json
          if-no-files-found: warn
      - name: Windows pinned Fable and Astra provenance
        shell: pwsh
        run: |
          python -m rea.provenance verify-vendor --vendor fable51 --root .vendor/fable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m rea.provenance verify-vendor --vendor astra_p4 --root .vendor/astra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows extracted CMD and localhost HTTP
        shell: pwsh
        run: |
          python -m scripts.d11_rehearsal --out $env:RUNNER_TEMP/rea-d18-win-quotes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows_native_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline dependency NOTICE metadata audit OUTSIDE ZIP
        run: python -m rea.dependency_evidence --out ./d18-windows-evidence.json
      - name: Upload developer-only audit (NOT license grant)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d18-windows-dependency-evidence
          path: d18-windows-evidence.json
          if-no-files-found: warn
