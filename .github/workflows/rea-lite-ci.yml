name: REA Lite isolated integration
on:
  push:
    branches: [feature/rea-lite-20261031]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lite-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install "pytest>=8,<10" "fastapi>=0.110,<1" "starlette>=1.3.1,<2" "uvicorn>=0.27,<1" "httpx>=0.27,<1"
      - name: Real Pro parser + Lite builder contract
        run: python -m pytest -q tests/test_rea_lite_builder.py tests/test_mvp.py

  lite-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Chromium DOM and native file URL tests
        run: python -m pytest -q tests/test_lite_file_browser.py

  lite-windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      REA_REQUIRE_NATIVE_FILE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows Chromium test dependencies
        run: |
          python -m pip install "pytest>=8,<10" "playwright>=1.50,<2"
          python -m playwright install chromium
      - name: Windows native file URL open, CSV rollback, export, reopen
        run: python -m pytest -q tests/test_lite_file_browser.py
