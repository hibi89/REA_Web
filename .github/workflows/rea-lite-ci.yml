name: REA Lite isolated integration
on:
  push:
    branches: [feature/rea-lite-20261031]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lite-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Real Pro parser + Lite builder contract
        run: python -m pytest -q tests/test_rea_lite_builder.py

  lite-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Chromium DOM and native file URL tests
        run: python -m pytest -q tests/test_lite_file_browser.py
