name: REA backend ZIP static contract checks
on:
  push:
    branches: [feature/rea-backend-zip-contract-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-and-regression:
    name: ZIP contract / ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<10"
      - name: Compile analysis code and test suite
        run: python -m compileall -q rea/adapter/backend_zip.py rea/adapter/response_contract.py rea/adapter/response_preflight.py rea/adapter/synthetic_example.py tests/test_backend_zip.py tests/test_response_contract.py tests/test_response_preflight.py tests/test_synthetic_example.py
      - name: ZIP contract, Fable boundary and existing Lite parser regression
        run: python -m pytest -q tests/test_backend_zip.py tests/test_adapter.py tests/test_rea_lite_integration.py tests/test_response_contract.py tests/test_response_preflight.py tests/test_synthetic_example.py
