name: REA D17 fresh Windows isolated venv creator rehearsal
on:
  push:
    branches: [feature/fresh-windows-venv-rehearsal]
  pull_request:
    branches: [integration/develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-d1-d17-and-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned Fable 88 source files
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: 7e6f273b359b207fad8f92016226e3058cbcb839
          path: .vendor/fable
          persist-credentials: false
      - name: Pinned Astra 103 PARTIAL source files
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: f044b66e799289a5a353fdb9cbfdb324e683ffa3
          path: .vendor/astra
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install developer tests only
        run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1" "pytest>=8,<10" "pydantic>=2.6,<3" "playwright>=1.50,<2" "packaging>=23,<27"
      - name: Full D1-D17 pytest regression
        env:
          PYTHONPATH: ".vendor/astra/engines/astra_p4:."
        run: python -m pytest -q tests
      - name: GUI module import without DISPLAY and stdlib Tk availability check
        run: python -c "import rea.creator_gui; print('D14 GUI import PASS; no display opened')"
      - name: Provenance pinned blobs, not rights
        run: |
          python -m rea.provenance verify-vendor --vendor fable51 --root .vendor/fable
          python -m rea.provenance verify-vendor --vendor astra_p4 --root .vendor/astra
      - run: python -m compileall -q rea scripts
      - name: Actual Tk GUI widget exercise under virtual DISPLAY (synthetic fixture only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth
          python -m pip install "pillow>=10,<13"
          xvfb-run -a -s "-screen 0 1280x900x24" python -m scripts.d14_tk_visual_smoke --out /tmp/rea-d17-visual
      - name: Upload real synthetic Tk widget screenshot and no-PII receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d17-linux-real-tk-visual-evidence
          path: /tmp/rea-d17-visual/
          if-no-files-found: warn
      - name: Real second-window two-file APPEND Tk E2E on Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1280x950x24" python -m scripts.d15_pair_tk_smoke --out /tmp/rea-d17-pair-ui
      - name: Upload synthetic real-Tk two-file APPEND evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d17-linux-pair-tk-evidence
          path: /tmp/rea-d17-pair-ui/
          if-no-files-found: warn
      - name: 8 Chromium synthetic webapps
        env:
          PYTHONPATH: ".vendor/astra/engines/astra_p4:."
        run: |
          python -m playwright install --with-deps chromium
          python scripts/d3_browser_acceptance.py --report-dir /tmp/rea-d17-browser
      - name: 3 EXTRACTED customer-like ZIPs in Chromium
        run: |
          python -m scripts.d11_rehearsal --out /tmp/rea-d17-quotes
          python scripts/d11_browser_rehearsal.py --rehearsal /tmp/rea-d17-quotes --report-dir /tmp/rea-d17-zip-browser
      - name: Offline dependency NOTICE metadata audit OUTSIDE ZIP
        run: python -m rea.dependency_evidence --out ./d17-linux-evidence.json
      - name: Upload developer-only audit (NOT license grant)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d17-linux-dependency-evidence
          path: d17-linux-evidence.json
          if-no-files-found: warn

  windows-d1-d17-and-native-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Disable CRLF conversion for exact vendor Git blobs
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.safecrlf false
      - name: Pinned Fable 88 source files
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: 7e6f273b359b207fad8f92016226e3058cbcb839
          path: .vendor/fable
          persist-credentials: false
      - name: Pinned Astra 103 PARTIAL source files
        uses: actions/checkout@v4
        with:
          repository: hibi89/REA_Web
          ref: f044b66e799289a5a353fdb9cbfdb324e683ffa3
          path: .vendor/astra
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install developer tests only
        run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1" "pytest>=8,<10" "pydantic>=2.6,<3" "packaging>=23,<27"
      - name: Full D1-D17 Windows pytest regression
        shell: pwsh
        run: |
          $env:PYTHONPATH = ".vendor/astra/engines/astra_p4;."
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows Tkinter import availability without opening a GUI
        shell: pwsh
        run: |
          python -c "import tkinter; import rea.creator_gui; print('GUI import PASS; human GUI acceptance NOT RUN')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows actual Tk desktop probe, honest NOT_RUN when no GUI session
        shell: pwsh
        run: |
          python -m scripts.d14_windows_gui_probe --out $env:RUNNER_TEMP/rea-d17-win-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows actual Tk/NOT_RUN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d17-windows-gui-evidence
          path: ${{ runner.temp }}/rea-d17-win-ui/
          if-no-files-found: warn
      - name: Real Windows two-file Tk APPEND synthetic desktop probe
        shell: pwsh
        run: |
          python -m scripts.d15_windows_pair_probe --out $env:RUNNER_TEMP/rea-d17-win-pair
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows two-file Tk PASS or NOT_RUN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d17-windows-pair-tk-evidence
          path: ${{ runner.temp }}/rea-d17-win-pair/
          if-no-files-found: warn
      - name: Native Windows creator CMD actual READY, invalid arg, missing Python checks
        shell: pwsh
        run: |
          python scripts/d16_windows_creator_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh isolated Windows venv, missing-modules refuse then CI-only dependency install, real Tk pair ZIP
        shell: pwsh
        run: |
          python -m scripts.d17_windows_fresh_venv --out "$env:RUNNER_TEMP/rea-d17-fresh-venv-evidence.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload developer-only fresh Windows venv result, no client data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d17-windows-fresh-venv-onboarding
          path: ${{ runner.temp }}/rea-d17-fresh-venv-evidence.json
          if-no-files-found: warn
      - name: Windows pinned Fable and Astra provenance
        shell: pwsh
        run: |
          python -m rea.provenance verify-vendor --vendor fable51 --root .vendor/fable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m rea.provenance verify-vendor --vendor astra_p4 --root .vendor/astra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows extracted CMD and localhost HTTP
        shell: pwsh
        run: |
          python -m scripts.d11_rehearsal --out $env:RUNNER_TEMP/rea-d17-win-quotes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows_native_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline dependency NOTICE metadata audit OUTSIDE ZIP
        run: python -m rea.dependency_evidence --out ./d17-windows-evidence.json
      - name: Upload developer-only audit (NOT license grant)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-d17-windows-dependency-evidence
          path: d17-windows-evidence.json
          if-no-files-found: warn
