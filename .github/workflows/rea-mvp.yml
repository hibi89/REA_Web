name: MVP CSV to App
on:
  pull_request:
    branches: [integration/develop, main]
  push:
    branches: [feature/csv-local-mvp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "pytest>=8,<10" "httpx>=0.27,<1"
      - run: python -m pytest -q tests/test_mvp.py
      - run: python -m rea.mvp --csv samples/products.csv --out ./out/example
      - run: python -m compileall -q rea out/example
